# The front end's nginx configuration: SPA routing, the /api proxy to the api
# app, the /storage proxy to the stamp's storage service, security headers,
# caching, and the health paths the stamp probes. Keep /healthz, /readyz,
# /config.json, /api, /storage and the headers when you change it. admin and
# dashboard use the same file.

# Hashed assets under /assets/ never change, so the browser keeps them for a
# year. The API and the storage set their own caching. Every other file is
# checked again on each visit.
map $uri $cache_control {
    ~^/assets/      "public, max-age=31536000, immutable";
    ~^/api/         "";
    ~^/storage/     "";
    /config.json    "no-store";
    default         "no-cache";
}

# WebSocket upgrades for the API's SignalR hub.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Inline styles are allowed because the UI components set style attributes;
    # the fonts come from Google Fonts.
    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Every path that isn't a file is a route of the app: index.html, and the
    # router in the browser shows the page or its "not found" page.
    location / {
        try_files $uri /index.html;
    }

    # A missing asset is a 404, not index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # The API, on the page's own origin, so it needs no CORS settings. The
    # path is passed on unchanged: the API serves its routes under /api. The
    # upstream comes from docker-entrypoint.sh: API_UPSTREAM, or the api app of
    # the stamp. nginx resolves it once, at start. Not buffered, so server-sent
    # events and the SignalR hub stream.
    location /api/ {
        include /etc/nginx/upstream/api.conf;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The stamp's object storage, on the page's own origin: the bucket is named
    # storage, so /storage/<key> is the object's path-style address. The Host
    # header stays the page's, because it is part of a presigned URL's
    # signature. No body size limit of nginx's own, and the body is streamed.
    location /storage/ {
        include /etc/nginx/upstream/storage.conf;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Written at container start by docker-entrypoint.sh.
    location = /config.json {
        alias /usr/share/nginx/config/config.json;
        default_type application/json;
    }

    # nginx serves the files itself, so it is alive and ready as soon as it
    # answers. The API has its own probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
