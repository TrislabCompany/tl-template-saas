# The whole product locally from the four Dockerfiles, for someone without the
# .NET SDK: docker compose up --build. With the SDK, the AppHost is the everyday
# run (docs/getting-started.md). The services are named like the apps in
# platform.yaml and the stamp's container services, so the front ends reach
# http://api:8080 and http://storage:9000 as they reach http://ca-<stamp>-api
# and http://ca-<stamp>-storage:9000 in a stamp. Like a dev stamp, it has
# Postgres and storage but no cache: the API runs on its in-memory cache. The
# settings come from .env, a copy of .env.example.
name: tl-template-saas

services:
  postgres:
    # The same Postgres as a dev stamp.
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  storage:
    # The same S3-compatible storage as a dev stamp. The migrator creates the
    # bucket storage, which a stamp's storage service creates itself.
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The init container of api in a stamp: it finishes before api starts.
  migrator:
    build: { context: ., dockerfile: src/Host/App.DbMigrator/Dockerfile }
    environment: &api-settings
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      HANGFIRE_PASSWORD: ${HANGFIRE_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO}
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: src/Host/App.Api/Dockerfile }
    environment: *api-settings
    depends_on:
      migrator: { condition: service_completed_successfully }

  admin:
    build: { context: clients/admin, dockerfile: Dockerfile }
    environment:
      API_UPSTREAM: http://api:8080
      STORAGE_UPSTREAM: http://storage:9000
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - api

  dashboard:
    build: { context: clients/dashboard, dockerfile: Dockerfile }
    environment:
      API_UPSTREAM: http://api:8080
      STORAGE_UPSTREAM: http://storage:9000
      PLATFORM_ENVIRONMENT: ${PLATFORM_ENVIRONMENT}
      PUBLIC_DEMO_MODE: ${SEED_DEMO}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - api

volumes:
  postgres:
  storage:
